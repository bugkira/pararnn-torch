[project]
name = "pararnn"
version = "0.1.0"
description = "PyTorch ParaRNN cells and Newton+PCR solvers"
authors = [
    { name = "Daniil Sereda", email = "dsereda@ptsecurity.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.11.0",
]

[project.optional-dependencies]
train = ["mlflow"]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mlflow>=3.15.2",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.9",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"

