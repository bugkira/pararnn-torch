[project]
name = "pararnn-torch"
version = "0.4.0"
description = "PyTorch sequence module for parallel RNN training (ParaRNN / Newton+scan)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Daniil Sereda", email = "128284937+bugkira@users.noreply.github.com" }
]
keywords = [
    "rnn",
    "lstm",
    "gru",
    "slstm",
    "xlstm",
    "sequence-modeling",
    "newton",
    "parallel-scan",
    "triton",
    "pytorch",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.11.0",
]

[project.urls]
Homepage = "https://github.com/bugkira/pararnn-torch"
Repository = "https://github.com/bugkira/pararnn-torch"
Issues = "https://github.com/bugkira/pararnn-torch/issues"
Documentation = "https://github.com/bugkira/pararnn-torch"

[project.optional-dependencies]
train = ["mlflow"]
flashrnn = [
    "flashrnn>=1.0.6",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mlflow>=3.15.2",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.9",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.build-backend]
module-name = "pararnn"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["cuda: requires a CUDA device"]
addopts = "--strict-markers"

[tool.ruff]
src = ["src", "tests", "examples", "scripts"]
target-version = "py310"
# Triton kernels carry wide arithmetic expressions; the default 88 would shred them.
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]
# Docs and comments use Cyrillic and typographic/math symbols (en-dashes, ×, ⊙) on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Examples/scripts insert repo root on sys.path before importing pararnn.
# scripts/gpu.py must set CUDA_DEVICE_ORDER before `import torch`.
"examples/**" = ["E402"]
"scripts/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pararnn", "examples", "scripts"]
known-local-folder = ["gpu"]

