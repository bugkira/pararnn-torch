[project]
name = "pararnn-torch"
version = "0.3.0"
description = "PyTorch sequence module for parallel RNN training (ParaRNN / Newton+scan)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Daniil Sereda", email = "dsereda@ptsecurity.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.11.0",
]

[project.optional-dependencies]
train = ["mlflow"]
flashrnn = [
    "flashrnn>=1.0.6",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mlflow>=3.15.2",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.9",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.build-backend]
module-name = "pararnn"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
src = ["src", "tests", "examples", "scripts"]
target-version = "py310"

[tool.ruff.lint.isort]
known-first-party = ["pararnn", "examples", "scripts"]
known-local-folder = ["gpu"]

