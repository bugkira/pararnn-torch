name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Merge gate: lint + CPU tests only. Self-hosted CUDA lives in gpu.yml so an
# offline lab box cannot leave this workflow queued / red forever.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          uv sync --group dev
          uv run ruff check
          uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync and test (CPU; CUDA tests deselected)
        run: |
          uv sync --group dev
          echo "CUDA-marked tests (deselected here; covered by gpu.yml):"
          uv run pytest --collect-only -q -m cuda
          uv run pytest -q -m "not cuda"
