name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Import smoke
        run: |
          uv sync --group dev
          uv run python -c "import pararnn; print(pararnn.__version__)"

  build:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v${TAG} does not match pyproject.toml version ${VERSION}"
            exit 1
          fi
      - name: Build distributions
        run: uv build
      - name: Wheel hygiene (no lab paths)
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          uv run python - <<PY
          import zipfile, sys
          z = zipfile.ZipFile("$WHEEL")
          names = z.namelist()
          bad = [n for n in names if any(x in n for x in ("babylm", "docs/internal", "/tests/", "/scripts/"))]
          if bad:
              print("bad paths:", bad[:20])
              sys.exit(1)
          print("wheel ok", "$WHEEL", "files", len(names))
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs:
      - smoke
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    # Trusted Publishing must be registered on PyPI for
    # bugkira/pararnn-torch + environment `pypi` + this workflow.
    # Until then the step fails loudly but does not block the GitHub Release.
    continue-on-error: true
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        run: |
          set +e
          uv publish --trusted-publishing always
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::PyPI publish failed (trusted publishing not linked yet)."
            echo "Register at https://pypi.org/manage/account/publishing/ :"
            echo "  Owner: bugkira   Repo: pararnn-torch"
            echo "  Workflow: release.yml   Environment: pypi"
            echo "Then re-run this job or retag."
          fi
          exit "$status"

  github-release:
    needs:
      - build
      - publish
    # Create the GitHub Release even when PyPI OIDC is still unconfigured.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)
          {
            echo "body<<EOF"
            printf "%s\n" "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          fail_on_unmatched_files: false
