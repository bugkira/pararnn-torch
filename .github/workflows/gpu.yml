name: gpu

# Optional lab CUDA smoke (device presence). Full pytest is in pararnn-lab.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu:
    if: github.repository == 'bugkira/pararnn-torch' && github.event.pull_request.head.repo.fork != true
    name: gpu (${{ matrix.label }})
    runs-on: [self-hosted, cuda]
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ampere-rtx3060-cc86
            cuda_visible_devices: "0"
          - label: turing-rtx2080ti-cc75
            cuda_visible_devices: "1"
    env:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${{ matrix.cuda_visible_devices }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Sync and print CUDA device
        run: |
          uv sync --group dev
          uv run python - <<'PY'
          import os
          import torch
          print("CUDA_DEVICE_ORDER", os.environ.get("CUDA_DEVICE_ORDER"))
          print("CUDA_VISIBLE_DEVICES", os.environ.get("CUDA_VISIBLE_DEVICES"))
          print("device_count", torch.cuda.device_count())
          if torch.cuda.is_available():
              print("name", torch.cuda.get_device_name(0))
              print("cc", torch.cuda.get_device_capability(0))
          import pararnn
          print("pararnn", pararnn.__version__)
          PY
