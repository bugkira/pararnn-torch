# ParaSLSTM fused Newton (auto Picard) vs NX-AI FlashRNN sequential sLSTM.
# CUDA_HOME: pip nvidia-cuda-runtime if unset (no system toolkit on this box).
# cuda_fused needs CC 8.0; 2080 Ti is 7.5 → backend=triton_fused, heads 8×32
# (D=64 exceeds Turing 64 KiB smem). Not the same mixing as mix='diag'.
#
# Protocol: 10 warmup / 50 runs — smoke, not App. B.
# GPU: 2080 Ti by name. MLflow newton-slstm-bench.

newton_iters: 3
# library auto P from T (1 if T<=64 else 3).
batch: 8
d_in: 256
d_h: 256
dtype: float32
x_scale: 1.0
warmup: 10
n_runs: 50
seq_lens: [64, 256, 512, 1024, 2048]
seq_lens_sequential_max: 2048
sequential_compile_mode: reduce-overhead
modes: [newton_fused, flashrnn]
newton_max_t:
  ParaSLSTM: 2048
cells:
  - name: ParaSLSTM
    mix: diag
require_agreement: true
agree_tol: 1.0e-3
mlflow_experiment: newton-slstm-bench
mlflow_run_name: slstm-fused-vs-flashrnn
csv: outputs/bench_newton_slstm_flashrnn.csv
why: >
  Honest sequential competitor is NX-AI FlashRNN sLSTM, not compiled PyTorch
  unroll. cuda_fused is Ampere+ (CC 8.0). On Turing: CUDA_HOME from the
  pip cuda_runtime wheel, backend=triton_fused, 8 heads × 32 (not diag).
  Protocol 10/50. Not 20-50× from ADD_TASK until Ampere numbers exist.
