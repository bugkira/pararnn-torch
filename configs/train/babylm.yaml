# BabyLM Strict-Small (~10M tokens) mixing ablation.
# Reviewer question: channelwise R vs Beck dense-per-head R on next-token PPL.
# Arms share this YAML; --cell_type selects the cell. GPU: RTX 3060 (Ampere
# sm_86, native bf16). Paper benches stay on the 2080 Ti / float32.

task: babylm_10m
dataset_train: BabyLM-community/BabyLM-2026-Strict-Small
# Official 2023/24 HF loader (BabyLM.py) is a removed dataset script.
# Val is a 256-chunk holdout from packed train (same 16k BPE). Same split
# for all three arms.
dataset_val: cambridge-climb/BabyLM
dataset_val_config: original_strict_small
dataset_val_split: dev

# 16k BPE: embedding stays inside the 20–25M band. GPT-2 50k vocab would make
# the tied head ~19M by itself (Brown et al. 2020 125M used 50k; this stack is
# a mixing ablation, not a GPT-2 replica). Fallback: keep 16k, do not switch
# to GPT-2 if PPL is high — that changes the param budget.
vocab_size: 16000
seq_len: 512
# Strict-Small word/token budget (Choshen et al. 2026 BabyLM Turns 4).
max_train_tokens: 10000000
# Periodic val: 32 packed sequences (16,384 tokens), same as one train step.
# Reported PPL at 250/500/end uses val_report_sequences.
val_sequences: 32
val_report_sequences: 256

# Width: 6 × 384 with 8 heads → d_head=48 (Beck xLSTM uses 4–8 heads at this
# width). Target ~20–25M including tied embeddings. Measure, do not pad.
num_layers: 6
d_model: 384
n_heads: 8
mlp_mult: 4
# GELU MLP is the GPT-2 block; SwiGLU is LLaMA. SwiGLU at mult=4 is ~0.6M extra
# per layer vs GELU and lands the diag stack near 20.5M. Fallback if VRAM
# OOMs: GELU (mlp_act: gelu), not a width cut.
mlp_act: swiglu

# B=16 × accum=2 × T=512 = 16,384 tokens/step (same as B=32). Head-mix
# sequential OOM'd at B=32 backward on 12 GB (10.2 GiB). Shallue: shrink
# batch, accumulate. Fused/diag_seq fit B=32; all arms share this for a
# matched token budget.
batch: 16
grad_accum: 2
max_steps: null
smoke_steps: 10
eval_every: 50
ppl_steps: [250, 500]

# Brown et al. 2020 (GPT-3 125M): peak 6e-4, AdamW β=(0.9, 0.95), wd=0.1 in
# that paper; 0.01 is the later GPT-NeoX / Llama default at this scale.
# Warmup 50 of ~610 steps ≈ 8% (ParaRNN App. C uses 10% on smokes). Cosine to 0.
# Fallback if train loss diverges: Shallue 3-point {2e-4, 6e-4, 2e-3}, keep
# warmup 50. Do not raise K.
lr: 6.0e-4
warmup_steps: 50
weight_decay: 0.01
adam_betas: [0.9, 0.95]
grad_clip: 1.0

# App. A: K=3. T=512 → slstm_auto_picard P=3 (T≤2048). User pin matches auto.
# picard_adapt=true so a >1e-3 residual climbs P=3→5 (library watchdog).
newton_iters: 3
picard_iters: 3
picard_adapt: true
# Opt-in numerics smoke: first Newton forward per ParaRNN layer runs
# verify_agreement once (docs/numerics-contract.md). Off for pure timing
# smokes; on for real trains.
verify_first_step: true
# App. C.1 clamp. Z2 disabled it; LM keeps it.
max_recurrent_norm: 0.5

# Fused Newton at d_model=384, T=512: bf16 DRAM residual 4.0 (diverged);
# fp32 fused matches sequential to 4.6e-4 (this box, B=8). All three arms
# use fp32 so mixing PPL is not a dtype confound. OOM fallback: B=16, accum=2.
dtype: float32
seed: 0
gpu: "3060"

# relative to repo
tokenizer_dir: data/tokenizer_babylm_16k
cache_dir: data/babylm
ckpt_dir: checkpoints/babylm
results_dir: results

mlflow_experiment: babylm-10m
mlflow_run_prefix: babylm

why: |
  Mixing ablation on BabyLM 2026 Strict-Small (10M tokens): Beck per-head
  dense R (mix=head, sequential) vs channelwise Diag-sLSTM (sequential vs
  fused Picard–Newton P=3 K=3). Same 6×384 pre-LN stack, 16k BPE, T=512.
  RTX 3060 fp32 (fused Newton at this width diverges in bf16 DRAM).
