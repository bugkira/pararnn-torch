# Toy copy smoke. Not paper Table 3 / SlimPajama — gate that AdamW can move ParaRNN.

task: copy  # input tokens = targets (per-position identity through the RNN)

# Synthetic alphabet; small enough that 100 CE steps can drop vs a random head.
vocab: 8
# Short T so Newton K=3 is cheap on 2080 Ti. Not LM context.
seq_len: 16
# Stable enough for a 100-step smoke; still a toy (Shallue et al. batching, not paper 125M).
batch: 32
# Hidden = 4×vocab. Not paper width (125M / 7B).
d_h: 32
# Wrapper smoke. ParaRNN stacking is naive (no residual/LN in the module).
num_layers: 1
# pytorch_port.md: 50–200 steps; 100 is the middle of that range.
steps: 100

# Danieli et al. 2025 App. A: residual to machine precision in 3–4 Newton
# steps for ParaGRU/ParaLSTM. If residual stays > 1e-4, try eager scan (or
# later hybrid PC) before raising K (Gonzalez et al. 2024 quasi-DEER).
newton_iters: 3

# Toy copy + CE + AdamW at this width. Not paper Table 3.
# If loss at step 100 >= step 0: log-grid {1e-3, 1e-2} (Shallue-style, 3 points).
lr: 3.0e-3
lr_fallback:
  - 1.0e-3
  - 1.0e-2

# No generalization target on synthetic copy (memorize the identity map).
weight_decay: 0.0

# Numerics/optimizer gate, not a DRAM bench. fp16 fused lives in
# configs/bench/newton_fp16.yaml. Turing: not bf16.
dtype: float32

# This example uses cuda if available, else CPU (not a lab GPU name).
# scan_backend=auto → fused for ParaGRU on CUDA.
scan_backend: auto

seed: 0
cell: para_gru  # paper §3 diagonal GRU

mlflow_experiment: toy-copy
mlflow_run_name: copy-paragru

why: |
  Prove ParaRNN.train() (Newton) + a linear head can be optimized with AdamW.
  Task is token copy (input = target), not SlimPajama / paper Table 3.
  K=3 from App. A. lr=3e-3 with Shallue-style 3-point fallback {1e-3, 1e-2}.
  wd=0 because there is nothing to regularize. float32. scan_backend=auto (fused on CUDA).
