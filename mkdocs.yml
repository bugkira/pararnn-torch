site_name: pararnn-torch
site_description: Parallel Newton+scan training for nonlinear RNNs
site_url: https://bugkira.github.io/pararnn-torch/
repo_url: https://github.com/bugkira/pararnn-torch
repo_name: bugkira/pararnn-torch
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

exclude_docs: |
  README.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Architecture:
      - Fidelity index: architecture/index.md
      - Spec template: architecture/TEMPLATE.md
      - ParaGRU: architecture/para_gru.md
      - ParaLSTM: architecture/para_lstm.md
      - ParaSLSTM: architecture/para_slstm.md
      - ParaNLRU: architecture/para_nlru.md
      - ParaM2RNN: architecture/para_m2rnn.md
  - Cell catalog (API): cells.md
  - Numerics contract: numerics-contract.md
  - Inference: inference.md
  - Adoption: adoption.md
  - Distributed: distributed.md
  - vLLM: vllm.md
  - OOM cookbook: oom-cookbook.md
  - Compile / AMP: compile-amp.md
  - Shapes / layout: shapes-layout.md
  - Backward scan: backward-scan-cap.md
  - xLSTM notes: xlstm.md
  - Repo layout: structure.md
