site_name: pararnn-torch
site_description: Parallel Newton+scan training for nonlinear RNNs
site_url: https://bugkira.github.io/pararnn-torch/
repo_url: https://github.com/bugkira/pararnn-torch
repo_name: bugkira/pararnn-torch
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

exclude_docs: |
  README.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md

  - Getting Started:
      - Quickstart: getting_started/quickstart.md
      - Adoption guide: getting_started/adoption.md
      - Shapes & layout: getting_started/shapes_layout.md

  - Core Architecture:
      - Newton + scan: core/newton_scan.md
      - Jacobian classes: core/jacobian_classes.md
      - Backward scan: core/backward_scan.md
      - Numerics & agreement: core/numerics_contract.md

  - Cell Catalog:
      - Overview: cells/index.md
      - Spec template: cells/spec_template.md
      - Fidelity labels: cells/fidelity.md
      - Audit matrix: cells/audit_matrix.md
      - Classic gated:
          - ParaGRU: cells/classic/para_gru.md
          - ParaLSTM: cells/classic/para_lstm.md
      - Normalized & resonant:
          - ParaNLRU: cells/normalized/para_nlru.md
          - ParaSLSTM: cells/normalized/para_slstm.md
      - Matrix & associative memory:
          - ParaHopfield: cells/matrix/para_hopfield.md
          - ParaM2RNN: cells/matrix/para_m2rnn.md
          - ParaRWKV7: cells/matrix/para_rwkv7.md
          - ParaTitans: cells/matrix/para_titans.md
      - Continuous & liquid (ODE):
          - ParaCfC: cells/continuous/para_cfc.md
      - API snippets: cells/api.md

  - Systems & Scaling:
      - Inference: systems/inference.md
      - vLLM: systems/vllm.md
      - Distributed: systems/distributed.md
      - Compile & AMP: systems/compile_amp.md
      - OOM cookbook: systems/oom_cookbook.md

  - Audit & Verification:
      - Verification suite: audit/verification.md
      - xLSTM notes: audit/xlstm_notes.md
      - Repository layout: audit/repo_layout.md
